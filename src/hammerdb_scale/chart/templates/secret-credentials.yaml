{{- if ne (($.Values.kubernetes).useSecrets | toString) "false" }}
{{- /*
Database credentials for each target.

Without this, passwords are plain `value:` entries in the Job spec and anyone
with read access to the namespace can recover them with `kubectl describe job`.
Here they become secretKeyRef lookups instead.

One Secret per release holds every target's credentials, keyed by target index,
so a single object is created and removed with the release.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hammerdb-scale-test.fullname" . }}-credentials
  labels:
    {{- include "hammerdb-scale-test.labels" . | nindent 4 }}
    {{- if .Values.extraLabels }}
    {{- range $key, $val := .Values.extraLabels }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
    {{- end }}
type: Opaque
stringData:
  {{- range $index, $target := .Values.targets }}
  {{- $oracleConfig := include "hammerdb-scale-test.oracle-config" (dict "root" $ "target" $target) | fromYaml }}
  target-{{ $index }}-username: {{ $target.username | quote }}
  target-{{ $index }}-password: {{ $target.password | quote }}
  {{- if eq $target.type "oracle" }}
  target-{{ $index }}-tprocc-password: {{ $oracleConfig.tproccPassword | quote }}
  target-{{ $index }}-tproch-password: {{ $oracleConfig.tprochPassword | quote }}
  {{- end }}
  {{- if eq $target.type "postgres" }}
  target-{{ $index }}-tprocc-password: {{ $target.postgres.tprocc.password | default "tpcc" | quote }}
  target-{{ $index }}-tproch-password: {{ $target.postgres.tproch.password | default "tpch" | quote }}
  {{- end }}
  {{- if eq $target.type "mysql" }}
  target-{{ $index }}-tprocc-password: {{ $target.mysql.tprocc.password | default "tpcc" | quote }}
  target-{{ $index }}-tproch-password: {{ $target.mysql.tproch.password | default "tpch" | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.pureStorage.enabled }}
  pure-api-token: {{ .Values.pureStorage.apiToken | quote }}
  {{- end }}
{{- end }}
